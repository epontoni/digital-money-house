version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-money-house-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./lib/db.json:/app/lib/db.json
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/landing"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
